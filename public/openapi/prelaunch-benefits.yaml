openapi: 3.0.3
info:
  title: WAYOUT Waitlist Benefits API
  version: 2.1.0
  description: |
    API server-to-server di sola lettura che restituisce gli iscritti idonei al benefit
    di 60 giorni gratuiti. Sono inclusi soltanto gli indirizzi verificati in waitlist
    che non hanno un acquisto Founder riuscito.

    Tutte le richieste sono firmate HMAC. La stringa canonica, separata da newline, è:
    `timestamp`, `nonce`, `METHOD`, `/api/path`, `sha256(raw_body)`.
    Per questa GET il body è vuoto e i parametri query non fanno parte del path firmato.
servers:
  - url: /api/v1/prelaunch
security:
  - WayoutKey: []
    WayoutTimestamp: []
    WayoutNonce: []
    WayoutSignature: []
paths:
  /benefits:
    get:
      summary: Elenca gli utenti idonei al benefit waitlist
      operationId: listWaitlistBenefits
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          description: Numero di risultati per pagina; il massimo predefinito è 200.
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Elenco paginato degli utenti idonei.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistBenefitListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/ReplayDetected' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /benefits/eligibility:
    post:
      summary: Verifica l'idoneità tramite email
      description: |
        Endpoint usato dal backend dell'app dopo che l'utente inserisce l'email nel popup.
        Una risposta positiva indica che il benefit waitlist può essere attivato.
      operationId: checkWaitlistBenefitEligibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 255, example: mario@example.com }
      responses:
        '200':
          description: Esito della verifica. `benefit` è nullo quando l'utente non è idoneo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistBenefitEligibilityResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/ReplayDetected' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    WayoutKey:
      type: apiKey
      in: header
      name: X-Wayout-Key
    WayoutTimestamp:
      type: apiKey
      in: header
      name: X-Wayout-Timestamp
    WayoutNonce:
      type: apiKey
      in: header
      name: X-Wayout-Nonce
    WayoutSignature:
      type: apiKey
      in: header
      name: X-Wayout-Signature
  schemas:
    WaitlistBenefit:
      type: object
      required: [benefit_id, email, waitlist_position, benefit_type, duration_days, email_verified_at]
      properties:
        benefit_id: { type: string, format: uuid }
        email: { type: string, format: email, example: mario@example.com }
        waitlist_position: { type: integer, minimum: 1, example: 184 }
        benefit_type: { type: string, enum: [waitlist] }
        duration_days: { type: integer, enum: [60] }
        email_verified_at: { type: string, format: date-time }
    PaginationMeta:
      type: object
      required: [page, per_page, total, last_page]
      properties:
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        last_page: { type: integer, minimum: 1 }
    WaitlistBenefitListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: array
          items: { $ref: '#/components/schemas/WaitlistBenefit' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    WaitlistBenefitEligibilityResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [eligible, benefit]
          properties:
            eligible: { type: boolean }
            benefit:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/WaitlistBenefit'
    Error:
      type: object
      properties:
        success: { type: boolean, enum: [false] }
        code: { type: string }
        message: { type: string }
  responses:
    Unauthorized:
      description: Firma server mancante, scaduta o non valida.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ReplayDetected:
      description: Nonce già utilizzato.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Parametri o payload non validi.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
